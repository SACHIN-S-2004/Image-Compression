<!DOCTYPE html>
<html>
<head>
    <title>Image Compression using K-Means</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }
        .card {
            border-radius: 16px;
        }
        img {
            max-width: 100%;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h2 class="text-center mb-4">
        🖼️ Image Compression using K-Means
    </h2>

    <!-- Upload Form -->
    <div class="card p-4 shadow-sm mb-4">

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Upload Image</label>
                <input type="file" name="image" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Colors (K)</label>
                <input type="number" name="k" value="16" min="2" max="64" class="form-control">
            </div>

            <button class="btn btn-primary w-100">
                Compress Image
            </button>
        </form>
    </div>


    {% if original %}

    <!-- Results -->
    <div class="row g-4">

        <div class="col-md-6">
            <h5>Original</h5>
            <img src="{{ url_for('static', filename=original) }}">
        </div>

        <div class="col-md-6">
            <h5>Compressed ({{k}} colors)</h5>
            <img src="{{ url_for('static', filename=compressed) }}">

            <a href="{{ url_for('static', filename=compressed) }}" download class="btn btn-success mt-3 w-100">
                Download
            </a>
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
